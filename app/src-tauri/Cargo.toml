[package]
name = "zephvox-app"
version = "0.1.0-rc.3"
description = "zephvox desktop app: window, tray, updates and the Python engine it supervises"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "zephvox_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

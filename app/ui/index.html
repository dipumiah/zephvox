<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zephvox</title>
<style>
  :root {
    --bg: #f2f7fb; --card: #ffffff; --ink: #1c2733; --muted: #5d6b7a; --line: #dbe5ee;
    --primary: #3a78ae; --ok: #3a9470; --alert: #cf7652; --track: #e3ecf4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1822; --card: #17232f; --ink: #e8eef4; --muted: #9fb0c0; --line: #27384a;
            --primary: #6aa6dc; --ok: #5cc29a; --alert: #eb9c7c; --track: #26384a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px 32px; }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo svg { width: 40px; height: 40px; }
  .logo b { font-size: 1.4rem; letter-spacing: .01em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .25s; }
  .bar.indeterminate > i { width: 35%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar.indeterminate > i { animation: none; margin-left: 0; width: 100%; opacity: .5; } .bar > i { transition: none; } }
  ul { list-style: none; margin: 16px 0 0; padding: 0; }
  li.item { padding: 10px 0; border-top: 1px solid var(--line); }
  li.item .row { display: flex; justify-content: space-between; gap: 12px; font-size: .92rem; }
  li.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.item .state { color: var(--muted); white-space: nowrap; }
  li.item.done .state { color: var(--ok); }
  li.item.failed .state { color: var(--alert); }
  li.item .bar { margin-top: 6px; }
  li.item small { color: var(--muted); display: block; margin-top: 4px; }
  .steps { margin: 0 0 14px; font-size: .9rem; color: var(--muted); }
  .steps span.done::before { content: "✓ "; color: var(--ok); }
  .steps span { display: block; }
  .error { border-color: var(--alert); }
  .error h1 { color: var(--alert); }
  pre { margin: 12px 0 0; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
        font: .8rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: 220px; overflow: auto; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
           background: var(--primary); color: #fff; margin-top: 14px; }
  button:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 50%, transparent); outline-offset: 2px; }
  details { margin-top: 14px; color: var(--muted); font-size: .9rem; }
  summary { cursor: pointer; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3A78AE"/><path d="M7 11c4-2.5 7 2.5 11 0s5-1 7 0M7 16.5c4-2.5 7 2.5 11 0s5-1 7 0M7 22c4-2.5 7 2.5 11 0" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
    <b>zephvox</b>
  </div>

  <section class="card" id="card" aria-live="polite">
    <h1 id="title">Starting…</h1>
    <p class="sub" id="sub"></p>
    <div class="steps" id="steps"></div>
    <div class="bar indeterminate" id="overall" role="progressbar" aria-label="Progress"><i></i></div>
    <ul id="items"></ul>
    <p id="message" hidden></p>
    <button id="retry" type="button" hidden>Try again</button>
    <details id="logbox"><summary>Details</summary><pre id="log"></pre></details>
  </section>
  <p class="note" id="note">The first start downloads the speech models (a few GB), so it takes a few minutes. Everything runs on your computer afterwards.</p>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const tauri = window.__TAURI__;
  const state = { step: null, done: [], items: new Map(), logs: [], error: null };

  const fmt = (b) => b == null ? "unknown size" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? Math.round(b / 1e6) + " MB" : Math.round(b / 1e3) + " KB";
  const pct = (d, t) => (t && d != null) ? Math.min(100, Math.floor(d / t * 100)) : null;
  const LABEL = { queued: "Waiting", downloading: "Downloading", verifying: "Checking", done: "Ready", failed: "Failed", paused: "Paused" };

  function setBar(el, value) {
    el.classList.toggle("indeterminate", value == null);
    if (value == null) el.removeAttribute("aria-valuenow"); else el.setAttribute("aria-valuenow", value);
    el.firstElementChild.style.width = value == null ? "" : value + "%";
  }

  function render() {
    const err = state.error;
    $("card").classList.toggle("error", !!err);
    const step = state.step;
    $("title").textContent = err ? "zephvox couldn't start" : (step ? step.title : "Starting…");
    $("sub").textContent = err ? "" : (step && step.n ? `Setup step ${step.n} of ${step.total}` : "");
    $("steps").replaceChildren(...state.done.slice(-4).map((t) => Object.assign(document.createElement("span"), { className: "done", textContent: t })));
    const items = [...state.items.values()];
    $("items").replaceChildren(...items.map((it) => {
      const li = document.createElement("li");
      li.className = "item " + it.state;
      const p = it.state === "done" ? 100 : pct(it.done, it.total);
      li.innerHTML = '<div class="row"><span class="name"></span><span class="state"></span></div>';
      li.querySelector(".name").textContent = it.label || it.name;
      li.querySelector(".state").textContent = (LABEL[it.state] || it.state) + (it.state === "downloading" && p != null ? " " + p + "%" : "");
      if (it.state !== "done" && it.state !== "failed") {
        const bar = document.createElement("div"); bar.className = "bar"; bar.setAttribute("role", "progressbar");
        bar.setAttribute("aria-label", it.label || it.name); bar.appendChild(document.createElement("i")); setBar(bar, p);
        li.appendChild(bar);
      }
      const small = document.createElement("small");
      small.textContent = it.state === "failed" ? (it.error || "Download failed") : it.state === "done" ? fmt(it.total) : `${fmt(it.done)} of ${fmt(it.total)}`;
      li.appendChild(small);
      return li;
    }));
    const known = items.filter((i) => i.total);
    const total = known.reduce((s, i) => s + i.total, 0);
    const done = items.reduce((s, i) => s + (i.state === "done" ? (i.total || 0) : (i.done || 0)), 0);
    setBar($("overall"), items.length && known.length === items.length ? pct(done, total) : null);
    $("overall").hidden = !!err;
    $("message").hidden = !err; $("message").textContent = err || "";
    $("retry").hidden = !err;
    $("log").textContent = state.logs.slice(-120).join("\n");
    $("logbox").open = !!err;
    $("note").hidden = !!err;
  }

  function apply(e) {
    switch (e.type) {
      case "reset": Object.assign(state, { step: null, done: [], items: new Map(), logs: [], error: null }); break;
      case "step": if (state.step && state.step.title !== e.title) state.done.push(state.step.title); state.step = e; break;
      case "download": state.items.set(e.id, e); break;
      case "log": state.logs.push(e.text); break;
      case "error": state.error = e.message; break;
    }
    render();
  }

  $("retry").addEventListener("click", () => { state.error = null; render(); tauri.core.invoke("boot_retry"); });

  if (!tauri) { $("title").textContent = "zephvox"; $("sub").textContent = "This page runs inside the zephvox app."; return; }
  tauri.event.listen("boot", (ev) => apply(ev.payload));
  tauri.core.invoke("boot_snapshot").then((s) => {
    state.step = s.step; state.error = s.error; state.logs = s.logs || [];
    (s.items || []).forEach((it) => state.items.set(it.id, it));
    render();
  });
})();
</script>
</body>
</html>

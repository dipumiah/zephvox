# Builds the installers (Windows, Linux x64 + arm64, macOS) when a version tag is pushed and attaches
# them, with the signed update manifest (latest.json), to a GitHub release. The app updates itself from
# that manifest, so the release is only published once every platform has built.
#
# One-time setup (see app/README.md):
#   - TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets: `npx tauri signer generate`,
#     and its public key in app/src-tauri/tauri.conf.json (plugins.updater.pubkey).
#   - optional: Apple (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
#     APPLE_PASSWORD, APPLE_TEAM_ID) and Windows code-signing secrets, to avoid "unknown developer" warnings.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree with the tag, and the updater key is set
        run: |
          python3 scripts/bump_version.py --check "${GITHUB_REF_NAME}"
          if grep -q REPLACE_WITH_PUBLIC_KEY app/src-tauri/tauri.conf.json; then echo "set plugins.updater.pubkey first"; exit 1; fi
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra web --extra desktop python -m pytest -q

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bundle the engine and uv
        run: python app/scripts/prepare_resources.py --target ${{ matrix.target }}
      - name: Icons
        run: |
          npm install
          npx tauri icon ../docs/assets/logo.svg
        working-directory: app
      - name: Sign and notarize for macOS, if the Apple secrets are set
        # Tauri signs whenever APPLE_CERTIFICATE exists, even empty, so the variables are only
        # exported when there is something in them; without them the app is built unsigned.
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
          else
            echo "No Apple certificate: building an unsigned app."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "zephvox ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        # Tags like v0.2.0-rc.1 become pre-releases: GitHub's "latest release" (which the app's update check
        # and the install scripts read) ignores them, so a test build never reaches real users.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${GITHUB_REF_NAME}" --jq .body)
          flags="--draft=false"
          case "${GITHUB_REF_NAME}" in *-rc*) flags="$flags --prerelease";; *) flags="$flags --latest";; esac
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes "$notes" $flags
